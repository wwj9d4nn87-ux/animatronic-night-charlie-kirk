<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-label="Charlie Kirk avatar">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#0b2a4a" />
      <stop offset="1" stop-color="#07203a" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)" rx="20" />
  <!-- head -->
  <ellipse cx="300" cy="250" rx="120" ry="150" fill="#f1d6b0" />
  <!-- hair -->
  <path d="M200 190 C230 120 370 120 400 190 L400 200 C370 150 230 150 200 200 Z" fill="#3b2b1b" />
  <!-- glasses -->
  <rect x="230" y="250" width="50" height="30" rx="6" ry="6" fill="#111" />
  <rect x="320" y="250" width="50" height="30" rx="6" ry="6" fill="#111" />
  <rect x="280" y="263" width="40" height="4" fill="#111" />
  <!-- eyes -->
  <circle cx="255" cy="265" r="6" fill="#fff" />
  <circle cx="345" cy="265" r="6" fill="#fff" />
  <!-- mouth -->
  <path d="M255 320 Q300 350 345 320" stroke="#b55" stroke-width="6" fill="none" stroke-linecap="round" />
  <!-- nameplate -->
  <rect x="60" y="420" width="480" height="80" rx="10" fill="rgba(0,0,0,0.25)" />
  <text x="300" y="470" font-family="Segoe UI, Roboto, Arial" font-size="30" fill="#ffffff" text-anchor="middle">Charlie Kirk</text>
  <text x="300" y="500" font-family="Segoe UI, Roboto, Arial" font-size="13" fill="#b7c7d9" text-anchor="middle">(stylized avatar)</text>
</svg>
