<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Animatronic Night — Charlie Kirk (Prototype)</title>
<style>
  * { box-sizing: border-box; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; }
  body { margin: 0; background:#070707; color:#eee; }
  #game { max-width:1100px; margin:12px auto; padding:12px; }
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  h1 { margin:0; font-size:18px; }
  #status { text-align:right; }
  main { display:grid; grid-template-columns:260px 1fr 260px; gap:12px; }
  .control-block { background:#101010; padding:10px; border-radius:6px; margin-bottom:12px; border:1px solid #1f1f1f;}
  #cams button, #left-controls button, #startBtn { display:block; width:100%; margin:6px 0; padding:8px; background:#151515; border:1px solid #333; color:#eee; border-radius:4px; cursor:pointer; }
  #cameraView { background:#000; height:420px; border-radius:6px; overflow:hidden; display:flex; align-items:center; justify-content:center; border:4px solid #222; position:relative; }
  #cameraTitle { margin-bottom:6px; font-weight:700; color:#ddd; }
  .anim { width:72px; height:72px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:36px; color:#111; font-weight:bold; }
  .golden { width:86px; height:86px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:34px; color:#222; font-weight:900; background: linear-gradient(180deg, #ffd54f, #ffb300); border: 3px solid rgba(255, 223, 97, 0.9); box-shadow: 0 0 18px rgba(255, 193, 7, 0.6), inset 0 -6px 10px rgba(0,0,0,0.12); transform: translateY(0); }
  .golden.sitting { transform: translateY(6px) rotate(-2deg); }
  #animList { list-style:none; padding:0; margin:0; }
  #animList li { padding:6px 8px; border-bottom:1px solid #151515; }
  #log { background:#070707; padding:8px; height:160px; overflow:auto; border-radius:6px; font-size:13px; color:#cfcfcf; border:1px solid #101010; }
  footer { display:flex; justify-content:space-between; align-items:center; margin-top:12px; }
  #message { font-weight:700; }
  #clock, #energy { font-size:14px; margin:2px 0; color:#ddd; }
  #goldenStat { font-size:13px; color:#ffd54f; margin-top:4px; }

  /* camera picture layout */
  .picture { width:96%; height:86%; display:flex; gap:12px; align-items:stretch; }
  .map { width:36%; background:#050608; border-radius:6px; padding:10px; border:1px solid rgba(255,255,255,0.03); }
  .map .pos { height:44px; margin:6px 0; border-radius:6px; display:flex; align-items:center; padding:6px; justify-content:space-between; background:rgba(255,255,255,0.02); color:#ccc; font-size:13px; }
  .map .pos.current { outline:2px solid rgba(100,200,255,0.12); background:rgba(100,200,255,0.02); }
  .live { flex:1; background:linear-gradient(180deg,#060607,#020203); border-radius:6px; padding:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; border:1px solid rgba(255,255,255,0.03); }
  .live .room-label { font-weight:800; margin-bottom:8px; color:#e7e7e7; }
  .live .view { width:88%; height:68%; border-radius:6px; background:linear-gradient(180deg,#0a0a0b,#020203); display:flex; align-items:center; justify-content:center; position:relative; border:1px solid rgba(255,255,255,0.02); }
  .prop { position:absolute; font-size:12px; color:#bdbdbd; background:rgba(0,0,0,0.25); padding:4px 6px; border-radius:4px; }
  .door-closed { background:rgba(200,0,0,0.9); color:#111; }
  .light-on { background:rgba(255,240,120,0.9); color:#111; }
  .cam-thumb { display:flex; gap:8px; align-items:center; }
  .cam-thumb .dot { width:32px; height:32px; border-radius:6px; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,0.02); font-size:18px; }

  @media(max-width:900px){ main { grid-template-columns:1fr; } .map { display:none; } .picture{ width:100%; height:100%; }
}
</style>
</head>
<body>
<div id="game">
  <header>
    <h1>Animatronic Night (Prototype)</h1>
    <div id="status">
      <div id="clock">Night: 0</div>
      <div id="energy">Energy: <span id="energyVal">100</span>%</div>
      <div id="goldenStat">Golden spawns: <span id="goldenCount">0</span></div>
    </div>
  </header>

  <main>
    <section id="left-controls">
      <div class="control-block">
        <h3>Doors & Lights</h3>
        <button id="leftDoor">Toggle Left Door</button>
        <button id="rightDoor">Toggle Right Door</button>
        <button id="leftLight">Toggle Left Light</button>
        <button id="rightLight">Toggle Right Light</button>
      </div>
      <div class="control-block">
        <h3>Cameras</h3>
        <div id="cams">
          <button data-cam="0">Cam 0 (Security Office)</button>
          <button data-cam="1">Cam 1 (Hall A)</button>
          <button data-cam="2">Cam 2 (Hall B)</button>
          <button data-cam="3">Cam 3 (Back Hall)</button>
          <button data-cam="4">Cam 4 (South Hall)</button>
          <button data-cam="5">Cam 5 (Lobby)</button>
          <button data-cam="6">Cam 6 (Main Stage)</button>
        </div>
      </div>
    </section>

    <section id="view">
      <div id="cameraHeader">
        <div id="cameraTitle">Camera: Security Office (0)</div>
        <div id="cameraInfo"></div>
      </div>
      <div id="cameraView"></div>
    </section>

    <section id="right-info">
      <div class="control-block">
        <h3>Animatronics</h3>
        <ul id="animList"></ul>
      </div>
      <div class="control-block">
        <h3>Log</h3>
        <div id="log"></div>
      </div>
    </section>
  </main>

  <footer>
    <button id="startBtn">Start Night</button>
    <div id="message"></div>
  </footer>
</div>

<!-- jumpscare overlay -->
<div id="jumpscare" role="presentation" aria-hidden="true">
  <div class="image" id="jumpscareImage" style="background:#000; display:flex; align-items:center; justify-content:center; flex-direction:column; height:100vh;}">
    <div class="big" id="jumpscareTitle">!!</div>
    <div class="sub" id="jumpscareSub">...</div>
  </div>
</div>

<script>
(() => {
  // DOM refs
  const energyEl = document.getElementById('energyVal');
  const clockEl = document.getElementById('clock');
  const cameraView = document.getElementById('cameraView');
  const cameraTitle = document.getElementById('cameraTitle');
  const animList = document.getElementById('animList');
  const logEl = document.getElementById('log');
  const messageEl = document.getElementById('message');
  const startBtn = document.getElementById('startBtn');
  const jumpscare = document.getElementById('jumpscare');
  const jumpscareTitle = document.getElementById('jumpscareTitle');
  const jumpscareSub = document.getElementById('jumpscareSub');
  const goldenCountEl = document.getElementById('goldenCount');

  // audio context (on demand)
  let audioCtx = null;
  function ensureAudioContext() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); return audioCtx; }

  function playScreamAndBoom() {
    try {
      const ctx = ensureAudioContext();
      const len = 1.2;
      const sampleRate = ctx.sampleRate;
      const buffer = ctx.createBuffer(1, Math.floor(len * sampleRate), sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (sampleRate * 0.7));
      const src = ctx.createBufferSource(); src.buffer = buffer;
      const bp = ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.setValueAtTime(1200, ctx.currentTime); bp.Q.value = 1.0;
      const sg = ctx.createGain(); sg.gain.setValueAtTime(0.0001, ctx.currentTime); sg.gain.linearRampToValueAtTime(0.9, ctx.currentTime + 0.12); sg.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + len);
      src.connect(bp); bp.connect(sg); sg.connect(ctx.destination);
      bp.frequency.linearRampToValueAtTime(2400, ctx.currentTime + 0.35); bp.frequency.linearRampToValueAtTime(400, ctx.currentTime + 0.95); src.start();
      setTimeout(()=>{ const osc = ctx.createOscillator(); const g = ctx.createGain(); osc.type='sine'; osc.frequency.setValueAtTime(80, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + 0.9); g.gain.setValueAtTime(0.0001, ctx.currentTime); g.gain.linearRampToValueAtTime(1.0, ctx.currentTime + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 1.0); const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.setValueAtTime(120, ctx.currentTime); osc.connect(g); g.connect(lp); lp.connect(ctx.destination); osc.start(); setTimeout(()=>osc.stop(),1000); }, 650);
    } catch(e) { /* ignore audio errors */ }
  }

  // --- game state ---
  let energy = 100;
  let nightTime = 0;
  const nightLength = 60; // seconds to survive
  let running = false;
  let tickInterval = null;
  let currentCam = 0;

  const cams = [
    { id:0, name:"Security Office (FNAF3-style)", posView: 6 },
    { id:1, name:"Hall A", posView: 1 },
    { id:2, name:"Hall B", posView: 2 },
    { id:3, name:"Back Hall", posView: 3 },
    { id:4, name:"South Hall", posView: 4 },
    { id:5, name:"Lobby", posView: 5 },
    { id:6, name:"Main Stage (FNAF2-style)", posView: 0 }
  ];

  const OFFICE_POS = 6; // office is pos 6 (attacks here)
  const MAX_POS = OFFICE_POS;

  const anims = [ { id: 'CK', label: 'Charlie Kirk', pos: 0, aggressiveness: 0.12, emoji: '🎭', side: 'left' } ];

  const goldenTrump = { active:false, pos: Math.floor(MAX_POS/2), timer:0, spawnDenominator: 726279 };
  const state = { leftDoor:false, rightDoor:false, leftLight:false, rightLight:false };

  // persistent stats
  function getGoldenCount(){ try{return parseInt(localStorage.getItem('goldenTrumpSpawns')||'0',10)||0;}catch(e){return 0;} }
  function setGoldenCount(n){ try{ localStorage.setItem('goldenTrumpSpawns', String(n)); }catch(e){} updateGoldenCountDisplay(); }
  function incrementGoldenCount(){ const n=getGoldenCount()+1; setGoldenCount(n); log(`Golden Trump total spawns (persisted): ${n}`); }
  function updateGoldenCountDisplay(){ if(goldenCountEl) goldenCountEl.textContent = String(getGoldenCount()); }

  // helpers
  function updateEnergy(delta){ energy=Math.max(0,Math.min(100,energy+delta)); energyEl.textContent=Math.round(energy); }
  function log(msg){ const t=new Date().toLocaleTimeString(); logEl.innerHTML=`<div>[${t}] ${msg}</div>`+logEl.innerHTML; }
  function renderAnimList(){ animList.innerHTML=''; anims.forEach(a=>{ const li=document.createElement('li'); li.textContent=`${a.label} (pos ${a.pos})`; animList.appendChild(li); }); if(goldenTrump.active){ const li=document.createElement('li'); li.textContent=`!!! Golden Trump is present (pos ${goldenTrump.pos}) — he is sitting`; li.style.color='#ffd54f'; li.style.fontWeight='800'; animList.insertBefore(li,animList.firstChild);} }

  // Render camera with a clear "picture" of what that camera sees
  function renderCamera(){
    cameraView.innerHTML='';
    cameraTitle.textContent = `Camera: ${cams[currentCam].name} (${currentCam})`;

    const picture = document.createElement('div'); picture.className='picture';

    // Left: map/positions list
    const map = document.createElement('div'); map.className='map';
    const positions = [0,1,2,3,4,5,6];
    positions.forEach(p=>{
      const div = document.createElement('div'); div.className='pos';
      if (p === cams[currentCam].posView) div.classList.add('current');
      div.innerHTML = `<span>Pos ${p}</span><span class="cam-thumb">`;
      // show small dot if anims present
      const present = anims.filter(a=>a.pos===p);
      const dotWrap = document.createElement('span'); dotWrap.className='cam-thumb';
      const dot = document.createElement('span'); dot.className='dot';
      dot.textContent = present.length ? present[0].emoji : '';
      dotWrap.appendChild(dot);
      const right = document.createElement('span');
      right.appendChild(dotWrap);
      div.appendChild(right);
      map.appendChild(div);
    });

    // Right / main live view
    const live = document.createElement('div'); live.className='live';
    const label = document.createElement('div'); label.className='room-label'; label.textContent = cams[currentCam].name;
    const view = document.createElement('div'); view.className='view';

    // show props depending on camera
    // door/light indicators for office/lobby
    if (cams[currentCam].posView === OFFICE_POS) {
      const door = document.createElement('div'); door.className='prop ' + (state.leftDoor || state.rightDoor ? 'door-closed' : '');
      door.style.left = '12px'; door.style.top='12px'; door.textContent = `Doors: ${state.leftDoor||state.rightDoor ? 'CLOSED' : 'OPEN'}`;
      view.appendChild(door);
      const light = document.createElement('div'); light.className='prop ' + (state.leftLight||state.rightLight ? 'light-on' : '');
      light.style.right='12px'; light.style.top='12px'; light.textContent = `Lights: ${state.leftLight||state.rightLight ? 'ON' : 'OFF'}`;
      view.appendChild(light);
    }

    // show anims that are actually in this camera's view (posView)
    const viewPos = cams[currentCam].posView;
    const hereAnims = anims.filter(a => a.pos === viewPos);
    hereAnims.forEach((a, idx) => {
      const el = document.createElement('div'); el.style.position='absolute'; el.style.fontSize='48px'; el.style.bottom = (10 + idx*80) + 'px'; el.style.left='50%'; el.style.transform='translateX(-50%)'; el.textContent = a.emoji; el.title = a.label; view.appendChild(el);
    });

    // golden visual if present at viewPos
    if (goldenTrump.active && goldenTrump.pos === viewPos) {
      const g = document.createElement('div'); g.className='golden sitting'; g.style.position='absolute'; g.style.left='50%'; g.style.top='28%'; g.style.transform='translateX(-50%)'; g.textContent='🟡T'; view.appendChild(g);
    }

    // if nothing in view, show static picture label
    if (hereAnims.length === 0 && !(goldenTrump.active && goldenTrump.pos === viewPos)) {
      const empty = document.createElement('div'); empty.style.color='#8a8a8a'; empty.style.textAlign='center'; empty.style.fontSize='18px'; empty.textContent = 'No animatronics on this camera'; view.appendChild(empty);
    }

    live.appendChild(label); live.appendChild(view);
    picture.appendChild(map); picture.appendChild(live);

    cameraView.appendChild(picture);
  }

  // attempt golden spawn
  function trySpawnGolden(){ if(goldenTrump.active) return; if (Math.floor(Math.random()*goldenTrump.spawnDenominator)===0){ goldenTrump.active=true; goldenTrump.timer=8; incrementGoldenCount(); log('A cold hush falls over the building... A rare presence has appeared.'); renderAnimList(); renderCamera(); } }

  function showJumpscare(victimLabel){ jumpscareTitle.textContent=victimLabel; jumpscareSub.textContent='YOU DIED'; jumpscare.classList.add('show'); setTimeout(()=>{ jumpscare.querySelector('.image').style.background='#220000'; jumpscareTitle.style.color='#ffdddd'; },40); try{ playScreamAndBoom(); }catch(e){} setTimeout(()=>{ jumpscare.classList.remove('show'); },2200); }

  function endGame(won, reason, killerLabel){ running=false; clearInterval(tickInterval); messageEl.textContent=reason; messageEl.style.color=won? 'lime':'red'; log(reason + (won? ' — WIN':' — GAME OVER')); startBtn.disabled=false; if(!won) showJumpscare(killerLabel||'JUMPSCARE'); }

  function tick(){ if(!running) return; nightTime++; clockEl.textContent = `Night: ${nightTime} / ${nightLength}`; trySpawnGolden(); anims.forEach(a=>{ if(a.pos>=OFFICE_POS) return; const base = a.aggressiveness + (nightTime/nightLength)*0.22; let penalty=0; if (a.pos>=OFFICE_POS-2){ if ((a.side==='left'&&state.leftDoor) || (a.side==='right'&&state.rightDoor)) penalty+=0.6; if ((a.side==='left'&&state.leftLight)||(a.side==='right'&&state.rightLight)) penalty+=0.4; } const chance=Math.max(0,base-penalty); if(Math.random()<chance){ a.pos=Math.min(OFFICE_POS,a.pos+1); log(`${a.label} moves to pos ${a.pos}`); } }); if(goldenTrump.active){ goldenTrump.timer=Math.max(0,goldenTrump.timer-1); if(goldenTrump.timer<=0){ endGame(false,'Golden Trump appeared and attacked!','Golden Trump'); return; } } applyCameraEnergy(); applyDoorsLightsEnergy(); renderAnimList(); renderCamera(); anims.forEach(a=>{ if(a.pos>=OFFICE_POS){ const doorClosed = (a.side==='left')? state.leftDoor : state.rightDoor; const lightOn = (a.side==='left')? state.leftLight : state.rightLight; let attackChance=0.85; if(doorClosed) attackChance-=0.85; if(lightOn) attackChance-=0.4; if(energy<=0){ log('Energy depleted! Systems failing...'); state.leftDoor=false; state.rightDoor=false; } if(!doorClosed && Math.random()<attackChance){ endGame(false,`${a.label} got you!`,a.label); } } }); if(energy<=0){ messageEl.textContent='WARNING: energy depleted'; messageEl.style.color='orange'; } else messageEl.textContent=''; if(nightTime>=nightLength) endGame(true,'You survived the night!'); }

  function applyCameraEnergy(){ updateEnergy(-0.7); }
  function applyDoorsLightsEnergy(){ let drain=0; if(state.leftDoor) drain+=0.8; if(state.rightDoor) drain+=0.8; if(state.leftLight) drain+=0.5; if(state.rightLight) drain+=0.5; updateEnergy(-drain); }

  // controls
  document.getElementById('leftDoor').addEventListener('click',()=>{ ensureAudioContext(); state.leftDoor=!state.leftDoor; log(`Left door ${state.leftDoor? 'CLOSED':'OPENED'}`); renderCamera(); updateEnergy(-1.5); });
  document.getElementById('rightDoor').addEventListener('click',()=>{ ensureAudioContext(); state.rightDoor=!state.rightDoor; log(`Right door ${state.rightDoor? 'CLOSED':'OPENED'}`); renderCamera(); updateEnergy(-1.5); });
  document.getElementById('leftLight').addEventListener('click',()=>{ ensureAudioContext(); state.leftLight=!state.leftLight; log(`Left light ${state.leftLight? 'ON':'OFF'}`); renderCamera(); updateEnergy(-0.8); });
  document.getElementById('rightLight').addEventListener('click',()=>{ ensureAudioContext(); state.rightLight=!state.rightLight; log(`Right light ${state.rightLight? 'ON':'OFF'}`); renderCamera(); updateEnergy(-0.8); });

  document.getElementById('cams').addEventListener('click',(e)=>{ const b=e.target.closest('button'); if(!b) return; ensureAudioContext(); const cam=parseInt(b.dataset.cam); currentCam=cam; renderCamera(); updateEnergy(-0.5); if(goldenTrump.active){ goldenTrump.active=false; goldenTrump.timer=0; log('You checked the cameras — Golden Trump has vanished. He was male.'); renderAnimList(); renderCamera(); } });

  startBtn.addEventListener('click',()=>{ ensureAudioContext(); if(running) return; energy=100; nightTime=0; running=true; anims.forEach(a=>a.pos=0); state.leftDoor=false; state.rightDoor=false; state.leftLight=false; state.rightLight=false; goldenTrump.active=false; goldenTrump.timer=0; renderAnimList(); renderCamera(); log('Night started'); startBtn.disabled=true; tickInterval=setInterval(tick,1000); });

  // initial render
  renderAnimList(); renderCamera(); clockEl.textContent = `Night: ${nightTime} / ${nightLength}`; updateGoldenCountDisplay(); document.body.addEventListener('click', ensureAudioContext,{ once:true });
})();
</script>
</body>
</html>
